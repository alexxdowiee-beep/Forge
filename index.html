  /* ============ EXERCISES TAB ============ */
  function renderExercisesTab() {
    if (state.exDetailName) { renderExerciseDetail(state.exDetailName); return; }
    var html = '<input type="text" id="libSearch" placeholder="Search or select an exercise\u2026" value="' + escapeHtml(state.exSearchQuery) + '" autocomplete="off">';
    var q = state.exSearchQuery.trim().toLowerCase();
    var names = allExerciseNames().filter(function (n) { return !q || n.toLowerCase().indexOf(q) !== -1; });

    html += '<div style="margin-top:10px">';
    if (!names.length) {
      html += '<div class="empty-state"><p>No exercises match.</p></div>';
    } else if (q) {
      // flat filtered list while searching
      names.forEach(function (n) {
        html += '<div class="ex-list-item" data-open="' + escapeHtml(n) + '"><span class="en">' + escapeHtml(n) + '</span><span class="pill">' + muscleOf(n) + '</span></div>';
      });
    } else {
      // grouped by muscle, collapsible
      var byMuscle = {};
      names.forEach(function (n) {
        var m = muscleOf(n);
        (byMuscle[m] = byMuscle[m] || []).push(n);
      });
      var groupOrder = MUSCLES.concat(Object.keys(byMuscle).filter(function (m) { return MUSCLES.indexOf(m) === -1; }));
      groupOrder.forEach(function (m) {
        if (!byMuscle[m] || !byMuscle[m].length) return;
        var open = !!state.exOpenGroups[m];
        html += '<div class="ex-list-item" data-togglegroup="' + escapeHtml(m) + '" style="cursor:pointer">' +
          '<span class="en">' + m + '</span>' +
          '<span class="pill">' + byMuscle[m].length + (open ? ' \u2212' : ' +') + '</span></div>';
        if (open) {
          byMuscle[m].forEach(function (n) {
            html += '<div class="ex-list-item" data-open="' + escapeHtml(n) + '" style="padding-left:14px">' +
              '<span class="en" style="font-weight:500;font-size:14px">' + escapeHtml(n) + '</span><span class="muted" style="font-size:11px">\u203a</span></div>';
          });
        }
      });
    }
    html += '</div>';
    var keepY = view.scrollTop;
    view.innerHTML = html;
    view.scrollTop = keepY;
    document.getElementById("libSearch").addEventListener("input", function (e) { state.exSearchQuery = e.target.value; renderExercisesTab(); preserveFocus(document.getElementById("libSearch")); });
    view.querySelectorAll("[data-togglegroup]").forEach(function (el) {
      el.addEventListener("click", function () {
        var m = el.getAttribute("data-togglegroup");
        state.exOpenGroups[m] = !state.exOpenGroups[m];
        renderExercisesTab();
      });
    });
    view.querySelectorAll("[data-open]").forEach(function (el) {
      el.addEventListener("click", function () { state.exDetailName = el.getAttribute("data-open"); render(); });
    });
  }

  function exerciseCue(name) {
    var found = EXERCISES.find(function (e) { return e.name.toLowerCase() === name.toLowerCase(); });
    return found && found.setup ? found : null;
  }

  function renderExerciseDetail(name) {
    var muscle = muscleOf(name);
    var cue = exerciseCue(name);
    var instances = [];
    state.workouts.forEach(function (w) {
      w.exercises.forEach(function (ex) { if (ex.name.toLowerCase() === name.toLowerCase()) instances.push({ date: w.date, sets: ex.sets }); });
    });
    // oldest first for the trend line, then flip for the list below
    instances.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    var best = 0;
    instances.forEach(function (inst) { inst.sets.forEach(function (s) { if (Number(s.weight) > best) best = Number(s.weight); }); });
    var bestHold = 0;
    instances.forEach(function (inst) { inst.sets.forEach(function (x) { if (Number(x.reps) > bestHold) bestHold = Number(x.reps); }); });
    var trendVals = instances.map(function (inst) {
      return inst.sets.reduce(function (m, s) { return Math.max(m, Number(s.weight) || 0); }, 0);
    });

    var def = exerciseDef(name);
    var hold = isHold(name);
    var html = '<button class="ex-detail-back" id="backBtn">\u2190 Exercises</button>';
    html += '<h2 class="ex-detail-head" style="font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.04em">' + escapeHtml(name) + '</h2>';
    html += '<div class="muscle-tag-lg">' + muscle + (def && def.target ? ' \u00b7 ' + def.target : '') + '</div>';
    if (hold) html += '<div class="kf-hold">' + (unitOf(name) === "min" ? "Target " + defaultHold(name) + " min" : "Hold " + defaultHold(name) + "s") + '</div>';

    if (cue) {
      html += '<div class="section-title">How To</div>';
      html += '<div class="card coach">' +
        '<div class="coach-block"><div class="coach-label">Set Up</div><p>' + escapeHtml(cue.setup) + '</p></div>' +
        '<div class="coach-block"><div class="coach-label">The Movement</div><p>' + escapeHtml(cue.execute) + '</p></div>' +
        '<div class="coach-block warn"><div class="coach-label">Watch Out For</div><p>' + escapeHtml(cue.mistake) + '</p></div>' +
        '</div>';
    }

    html += youtubeLinkHtml(name);

    html += '<div class="section-title">Previous Performance</div>';
    if (!instances.length) {
      html += '<div class="card muted" style="text-align:center">Not logged yet</div>';
    } else {
      if (hold) {
        html += '<div class="card"><div class="row-between"><span class="muted" style="font-size:12px">' + (unitOf(name) === "min" ? "Longest session" : "Longest hold") + '</span><span class="stat-num" style="font-size:18px">' + bestHold + unitOf(name) + '</span></div></div>';
      } else {
        html += '<div class="card"><div class="row-between" style="margin-bottom:' + (trendVals.length > 1 ? '10px' : '0') + '"><span class="muted" style="font-size:12px">All-time best</span><span class="stat-num" style="font-size:18px">' + fmtW(best) + ' kg</span></div>';
        if (trendVals.length > 1) html += sparkline(trendVals, 280, 50, "var(--accent)");
        html += '</div>';
      }
      instances.slice().reverse().slice(0, 10).forEach(function (inst) {
        html += '<div class="prev-perf-row"><span class="muted">' + shortDate(inst.date) + '</span><span>' + escapeHtml(setsSummary(inst.sets, name)) + '</span></div>';
      });
    }
    view.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", function () { state.exDetailName = null; state.exSearchQuery = ""; render(); });
  }

  /* ============ HISTORY ============ */
  function renderHistory() {
    if (!state.workouts.length) {
      view.innerHTML = '<div class="empty-state"><p>No workouts logged yet.</p></div>' +
        '<button class="secondary" id="backfillBtn" style="width:100%">+ Log a past workout</button>';
      bindBackfill();
      return;
    }
    var html = '';
    html += '<button class="secondary" id="backfillBtn" style="width:100%;margin-bottom:14px">+ Log a past workout</button>';
    state.workouts.forEach(function (w) {
      var open = state.openHistoryId === w.id;
      var kcal = estimateCalories(w);
      var top = topSetLabel(w);
      html += '<div class="hist-item"><div class="hist-head" data-toggle="' + w.id + '">' +
        '<div class="hist-main">' +
          '<div class="hist-title"><span class="hist-name">' + escapeHtml(sessionName(w)) + '</span>' +
            '<span class="hist-when">' + relDate(w.date) + '</span></div>' +
          '<div class="hist-tags">' + muscleTags(w).map(function (m) { return '<span class="tag">' + m + '</span>'; }).join("") +
            '<span class="hist-sets">' + workoutSetCount(w) + (workoutSetCount(w) === 1 ? ' set' : ' sets') + '</span></div>' +
          (top ? '<div class="hist-top">' + escapeHtml(top) + '</div>' : '') +
        '</div>' +
        '<div class="hist-kcal">' + (kcal !== null ? '<span class="stat-num">~' + kcal + '</span><span class="kcal-u">kcal</span>' : '<span class="kcal-na">\u2014</span>') + '</div>' +
        '</div><div class="hist-detail' + (open ? ' open' : '') + '">' +
        w.exercises.map(function (ex) { return '<div class="hist-ex"><b>' + escapeHtml(ex.name) + '</b><br><span class="s">' + escapeHtml(setsSummary(ex.sets, ex.name)) + '</span></div>'; }).join("") +
        '<div class="hist-foot"><span>' + Math.round(workoutVolume(w)).toLocaleString() + ' kg volume</span><span>' + fmtDuration(w.durationSec || 0) + '</span>' +
          (kcal !== null ? '<span>~' + kcal + ' kcal (est.)</span>' : '<span>Log body weight for kcal</span>') + '</div>' +
        '<div style="text-align:right;margin-top:6px"><button class="ghost danger" data-del="' + w.id + '">Delete</button></div>' +
        '</div></div>';
    });
    var keepY = view.scrollTop;
    view.innerHTML = html;
    view.scrollTop = keepY;
    bindBackfill();
    view.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function () { var id = el.getAttribute("data-toggle"); state.openHistoryId = state.openHistoryId === id ? null : id; renderHistory(); });
    });
    view.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", async function (e) { e.stopPropagation(); await store.deleteWorkout(btn.getAttribute("data-del")); if (!db) renderHistory(); });
    });
  }

  function bindBackfill() {
    var btn = document.getElementById("backfillBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      if (state.activeWorkout) {
        showConfirm("Finish the current workout first",
          "You have a session in progress. Finish or discard it before logging a past one.", "OK", function () {});
        return;
      }
      showDatePrompt("Log a past workout", function (d) {
        state.activeWorkout = { date: d.toISOString(), startedAt: Date.now(), backdated: true, exercises: [] };
        state.viewingWorkout = true;
        saveDraft();
        render();
      });
    });
  }

  /* ============ GOALS ============ */
  function goalBar(pct) {
    return '<div class="goal-track"><div class="goal-fill" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></div></div>';
  }

  function renderGoals() {
    var g = state.goals || { lifts: [] };
    var html = "";

    // --- body weight ---
    var bw = latestBodyweight();
    html += '<div class="section-title">Body Weight</div>';
    if (g.bodyweight) {
      var start = g.bodyweightStart || bw || g.bodyweight;
      var pct = 0;
      if (bw && start !== g.bodyweight) pct = Math.round((start - bw) / (start - g.bodyweight) * 100);
      var togo = bw ? Math.abs(bw - g.bodyweight) : null;
      html += '<div class="card goal-card" data-goal="bodyweight">' +
        '<div class="row-between"><span class="goal-name">Target ' + fmtW(g.bodyweight) + ' kg</span>' +
        '<span class="stat-num goal-val">' + (bw ? fmtW(bw) + ' kg' : '\u2014') + '</span></div>' +
        goalBar(pct) +
        '<div class="goal-sub">' + (togo !== null ? fmtW(Math.round(togo * 10) / 10) + ' kg to go' : 'Log your weight to track this') + '</div>' +
        '</div>';
    } else {
      html += '<button class="secondary goal-add" data-set="bodyweight">+ Set a body weight goal</button>';
    }

    // --- weekly workouts ---
    html += '<div class="section-title">Weekly Training</div>';
    if (g.perWeek) {
      var done = workoutsThisWeek();
      html += '<div class="card goal-card" data-goal="perWeek">' +
        '<div class="row-between"><span class="goal-name">' + g.perWeek + ' workouts a week</span>' +
        '<span class="stat-num goal-val">' + done + '/' + g.perWeek + '</span></div>' +
        goalBar(done / g.perWeek * 100) +
        '<div class="goal-sub">' + (done >= g.perWeek ? 'Target hit this week \u2705' : (g.perWeek - done) + ' to go this week') + '</div>' +
        '</div>';
    } else {
      html += '<button class="secondary goal-add" data-set="perWeek">+ Set a weekly target</button>';
    }

    // --- lift goals ---
    html += '<div class="section-title">Strength Goals</div>';
    (g.lifts || []).forEach(function (lg, i) {
      var cur = currentBestFor(lg.name);
      var pctL = lg.target ? Math.round(cur / lg.target * 100) : 0;
      html += '<div class="card goal-card" data-lift="' + i + '">' +
        '<div class="row-between"><span class="goal-name">' + escapeHtml(lg.name) + '</span>' +
        '<span class="stat-num goal-val">' + fmtW(cur) + ' / ' + fmtW(lg.target) + ' kg</span></div>' +
        goalBar(pctL) +
        '<div class="goal-sub">' + (cur >= lg.target ? 'Achieved \ud83c\udfc6' : fmtW(Math.round((lg.target - cur) * 10) / 10) + ' kg to go') +
        '<button class="ghost danger goal-del" data-delgoal="' + i + '">Remove</button></div>' +
        '</div>';
    });
    html += '<button class="secondary goal-add" id="addLiftGoal">+ Add a strength goal</button>';

    // --- progression summary ---
    var x = xpStats();
    html += '<div class="section-title">Progression</div>';
    html += '<div class="stat-grid">' +
      '<div class="stat-box"><span class="stat-num">' + x.level + '</span><div class="stat-label">Level</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + x.xp.toLocaleString() + '</span><div class="stat-label">Total XP</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + x.workouts + '</span><div class="stat-label">Workouts</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + x.prs + '</span><div class="stat-label">PRs Set</div></div>' +
      '</div>';
    html += '<div class="xp-note">50 XP a workout \u00b7 5 XP a set \u00b7 100 XP a PR</div>';

    view.innerHTML = html;

    view.querySelectorAll("[data-set]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var kind = btn.getAttribute("data-set");
        if (kind === "bodyweight") {
          showNumberPrompt("Target body weight", "kg", "", function (n) {
            state.goals.bodyweight = n;
            state.goals.bodyweightStart = latestBodyweight() || n;
            saveGoals(); render();
          });
        } else {
          showNumberPrompt("Workouts per week", "e.g. 4", "", function (n) {
            state.goals.perWeek = Math.round(n); saveGoals(); render();
          });
        }
      });
    });
    view.querySelectorAll("[data-goal]").forEach(function (card) {
      card.addEventListener("click", function () {
        var kind = card.getAttribute("data-goal");
        showConfirm("Remove this goal?", "", "Remove", function () {
          if (kind === "bodyweight") { state.goals.bodyweight = null; state.goals.bodyweightStart = null; }
          else state.goals.perWeek = null;
          saveGoals(); render();
        });
      });
    });
    view.querySelectorAll("[data-delgoal]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.goals.lifts.splice(Number(btn.getAttribute("data-delgoal")), 1);
        saveGoals(); render();
      });
    });
    var addBtn = document.getElementById("addLiftGoal");
    if (addBtn) addBtn.addEventListener("click", function () {
      var names = allExerciseNames().filter(function (n) { return !isHold(n); });
      showPickPrompt("Pick an exercise", names, function (name) {
        showNumberPrompt("Target for " + name, "kg", currentBestFor(name) || "", function (n) {
          state.goals.lifts = state.goals.lifts || [];
          state.goals.lifts.push({ name: name, target: n });
          saveGoals(); render();
        });
      });
    });
  }

  /* ============ PROGRESS ============ */
  function renderProgress() {
    var html = '';

    html += '<div class="card"><div class="row-between" style="margin-bottom:8px"><span style="font-weight:600;font-size:13px">Body Weight</span>' +
      '<span class="stat-num" style="font-size:16px">' + (state.bodyweights[0] ? fmtW(state.bodyweights[0].weight) + ' kg' : '--') + '</span></div>';
    var bwVals = state.bodyweights.slice(0, 20).reverse().map(function (b) { return Number(b.weight); });
    html += bwVals.length > 1 ? sparkline(bwVals, 280, 60, "var(--accent)") : '<div class="muted" style="font-size:12px">Log body weight to see a trend</div>';
    html += '</div>';

    var volSeries = state.workouts.slice(0, 20).reverse().map(function (w) { return workoutVolume(w); });
    html += '<div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Volume Per Workout</div>';
    html += volSeries.length > 1 ? sparkline(volSeries, 280, 60, "var(--accent)") : '<div class="muted" style="font-size:12px">Finish a few workouts to see a trend</div>';
    html += '</div>';

    var totalVolume = state.workouts.reduce(function (s, w) { return s + workoutVolume(w); }, 0);
    var last8WeeksCounts = [];
    for (var i = 7; i >= 0; i--) {
      var ws = new Date(); ws.setDate(ws.getDate() - i * 7);
      var start = startOfWeek(ws), end = new Date(start); end.setDate(end.getDate() + 7);
      var c = state.workouts.filter(function (w) { var d = new Date(w.date); return d >= start && d < end; }).length;
      last8WeeksCounts.push(c);
    }
    html += '<div class="stat-grid">' +
      '<div class="stat-box"><span class="stat-num">' + Math.round(totalVolume).toLocaleString() + '</span><div class="stat-label">Total Volume (kg)</div></div>' +
      '<div class="stat-box"><span class="stat-num">' + state.workouts.length + '</span><div class="stat-label">Total Workouts</div></div>' +
      '</div>';

    html += '<div class="card" style="margin-top:14px"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Workouts / Week</div>' +
      '<div class="week-spark" style="height:44px">' + last8WeeksCounts.map(function (c) {
        var h = Math.max(4, Math.round((c / Math.max.apply(null, last8WeeksCounts.concat([1]))) * 44));
        return '<div class="bar' + (c > 0 ? ' filled' : '') + '" style="height:' + h + 'px"></div>';
      }).join("") + '</div></div>';

    html += '<div class="section-title">Personal Records</div>';
    var prMap = {};
    state.workouts.forEach(function (w) {
      w.exercises.forEach(function (ex) {
        if (isHold(ex.name)) return;
        (ex.sets || []).forEach(function (s) {
          var wt = Number(s.weight) || 0;
          if (!prMap[ex.name] || wt > prMap[ex.name]) prMap[ex.name] = wt;
        });
      });
    });
    Object.keys(prMap).forEach(function (k) { if (!prMap[k]) delete prMap[k]; });
    var prNames = Object.keys(prMap).sort(function (a, b) { return prMap[b] - prMap[a]; }).slice(0, 8);
    if (!prNames.length) html += '<div class="card muted" style="text-align:center">No PRs yet \u2014 finish a workout to set some</div>';
    else {
      html += '<div class="card">' + prNames.map(function (n) {
        return '<div class="pr-row"><span>\ud83c\udfc6 ' + escapeHtml(n) + '</span><span class="pw">' + fmtW(prMap[n]) + ' kg</span></div>';
      }).join("") + '</div>';
    }

    html += '<div class="section-title">Muscle Group Breakdown</div>';
    var cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    var muscleCounts = {};
    MUSCLES.forEach(function (m) { muscleCounts[m] = 0; });
    state.workouts.forEach(function (w) {
      if ((w.createdAt || 0) < cutoff) return;
      w.exercises.forEach(function (ex) {
        var m = muscleOf(ex.name);
        muscleCounts[m] = (muscleCounts[m] || 0) + (ex.sets ? ex.sets.length : 0);
      });
    });
    var maxM = Math.max.apply(null, Object.keys(muscleCounts).map(function (k) { return muscleCounts[k]; }).concat([1]));
    html += '<div class="card">';
    var anySets = Object.keys(muscleCounts).some(function (k) { return muscleCounts[k] > 0; });
    if (!anySets) {
      html += '<div class="muted" style="text-align:center;font-size:12px">No sets logged in the last 30 days</div>';
    } else {
      MUSCLES.forEach(function (m) {
        var c = muscleCounts[m] || 0;
        html += '<div class="muscle-bar-row"><div class="mlabel"><span>' + m + '</span><span class="muted">' + c + ' sets</span></div>' +
          '<div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:' + Math.round((c / maxM) * 100) + '%"></div></div></div>';
      });
    }
    html += '</div>';

    view.innerHTML = html;
  }

  /* ============ tab bar ============ */
  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.viewingWorkout = false;
      state.tab = btn.getAttribute("data-tab");
      state.exDetailName = null;
      state.exSearchQuery = "";
      render();
    });
  });

  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
