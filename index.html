<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Forge</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="application-name" content="Forge">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    --bg: #0A0A0B;
    --surface: #141416;
    --surface2: #1D1E21;
    --ink: #F5F5F6;
    --muted: #8C8D92;
    --faint: #4E5054;
    --accent: #FF4A16;
    --accent-ink: #120B07;
    --gold: #F0B429;
    --danger: #E5484D;
    --border: #26272B;
    --font-display: 'Anton', 'Arial Narrow', 'Haettenschweiler', sans-serif;
    --font-body: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  main#view {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 96px;
  }
  h1, h2, h3 { margin: 0; }

  /* ---------- nav ---------- */
  /* ---- banner ---- */
  #topbar {
    position: sticky; top: 0; z-index: 25;
    background: var(--bg);
    padding: 14px 18px 0;
    border-bottom: 2px solid var(--accent);
  }
  .tb-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tb-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .tb-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .tb-title.wordmark {
    font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase;
    font-weight: 700; padding-left: 1px;
  }
  .tb-title {
    font-family: var(--font-display); font-weight: 600; font-size: 21px;
    letter-spacing: 0.01em;
  }
  .tb-right, #topbar .elapsed {
    font-size: 12px; color: var(--muted); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #topbar .elapsed { font-family: var(--font-display); font-size: 19px; color: var(--ink); }
  #topbar > .tb-main { padding-bottom: 12px; }
  #topbar > .momentum { padding-bottom: 11px; }
  .momentum { margin-top: -4px; }
  .mo-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .mo-lvl {
    font-family: var(--font-display); font-size: 13px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.03em; text-transform: uppercase;
  }
  .mo-xp { font-size: 10.5px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .mo-track { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .mo-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
  .mo-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 5px; }

  /* ---- goals ---- */
  .goal-card { cursor: pointer; }
  .goal-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
  .goal-val { font-size: 16px; }
  .goal-track { height: 8px; background: var(--surface2); border-radius: 5px; overflow: hidden; margin: 10px 0 7px; }
  .goal-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width 0.4s ease; }
  .goal-sub {
    font-size: 11.5px; color: var(--muted); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .goal-add { width: 100%; margin-bottom: 4px; }
  .xp-note { font-size: 11px; color: var(--faint); text-align: center; margin-top: 12px; }
  .pick-list { max-height: 230px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; }
  .pick-item { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .pick-item:last-child { border-bottom: none; }
  .wk-label {
    font-family: var(--font-display); font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  }

  /* ---- Anton treatment: condensed caps, tight tracking ---- */
  .stat-num, .elapsed, .hist-kcal .stat-num, .finish-vol, .fstat-num {
    letter-spacing: 0.005em; line-height: 1.08;
  }
  .section-title { letter-spacing: 0.09em; font-size: 12.5px; }
  .ex-name, .hist-name, .goal-name, .routine-tile .rt-name, .exercise-name {
    text-transform: uppercase; letter-spacing: 0.035em; line-height: 1.18;
  }
  .ex-name { font-size: 16px; }
  .hist-name { font-size: 16px; }
  .routine-tile .rt-name { font-size: 14px; }
  .goal-name { font-size: 14px; }
  .today-card .routine-name, .finish-card h2, .dialog h3 {
    text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.15;
  }
  .coach-label { letter-spacing: 0.1em; }
  .mo-lvl { letter-spacing: 0.1em; }
  .hist-date, .stat-box .stat-num, .prog-sets { letter-spacing: 0.01em; }
  .big-cta { letter-spacing: 0.09em; text-transform: uppercase; }
  .tb-title { letter-spacing: 0.06em; text-transform: uppercase; }
  .muscle-tag-lg { letter-spacing: 0.08em; }
  h2.section, .section-title { font-weight: 400; }

  /* ---- centred layout pass ---- */
  .section-title { text-align: center; }
  .stat-box { text-align: center; }
  .routine-tile { align-items: center; text-align: center; }
  .today-card { text-align: center; }
  .ex-card .ex-name, .ex-card .last-time { text-align: center; }
  .set-line input { text-align: center; }
  input[type="number"], .dialog input { text-align: center; }

  /* goal cards: name over value, centred */
  .goal-card .row-between { flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .goal-sub { justify-content: center; gap: 12px; text-align: center; }

  /* home cards */
  .card.bw-box { justify-content: center; gap: 16px; }
  .offline-note { text-align: center; }
  .yt-link { justify-content: center; }
  .yt-link .yt-go { margin-left: 4px; }

  /* exercise detail heading */
  .ex-detail-head { text-align: center; }
  .muscle-tag-lg { text-align: center; }
  .coach-label { text-align: center; }

  /* ---- motion + touch feedback ---- */
  @keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .screen-in { animation: screenIn 0.16s ease-out; }
  @keyframes tickFlash {
    0%   { background: rgba(255,74,22,0.30); }
    100% { background: transparent; }
  }
  .set-line.flash { animation: tickFlash 0.55s ease-out; border-radius: 8px; }
  .check-btn { transition: transform 0.08s ease, background 0.12s ease; }
  .check-btn:active { transform: scale(0.88); }
  .routine-tile, .card, .big-cta, .secondary { transition: transform 0.1s ease; }
  .big-cta:active, .secondary:active { transform: scale(0.98); }
  .tab { transition: color 0.14s ease; }

  /* ---- weight stepper ---- */
  .wt-cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .wt-cell input { flex: 1; min-width: 0; padding-left: 2px; padding-right: 2px; }
  .step {
    width: 26px; height: 34px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px;
    font-size: 15px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s ease;
  }
  .step:active { transform: scale(0.9); background: var(--accent); color: var(--accent-ink); }
  .step:disabled { opacity: 0.3; }

  @media (prefers-reduced-motion: reduce) {
    .screen-in, .set-line.flash { animation: none; }
  }

  /* ---- home: collapsed routine + targets ---- */
  .routine-switch {
    width: 100%; background: none; border: none; color: var(--ink);
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    padding: 2px 0 10px;
  }
  .rs-eyebrow {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .rs-name {
    font-family: var(--font-display); font-size: 21px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .rs-chev { font-size: 11px; color: var(--accent); }

  .target-list {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 4px 0; margin-bottom: 8px;
  }
  .tgt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 2px; font-size: 13px; gap: 10px;
  }
  .tgt-name {
    color: var(--ink); text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tgt-val {
    font-family: var(--font-display); font-size: 15px; color: var(--accent);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .tgt-val.new { color: var(--faint); font-family: var(--font-body); font-size: 11px; font-weight: 700; }
  .tgt-more { font-size: 11px; color: var(--faint); padding: 4px 2px 6px; }
  .tgt-caption {
    font-size: 10.5px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
  }

  /* ---- compact stat row ---- */
  .quick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
  .quick-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
    padding: 11px 6px; text-align: center; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .qs-val {
    font-family: var(--font-display); font-size: 20px; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .qs-unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .qs-lbl {
    font-size: 10px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .qs-trend { color: var(--accent); }
  .qs-add {
    color: var(--accent-ink); background: var(--accent);
    border-radius: 50%; padding: 0 4px; font-weight: 800;
  }

  /* ---- workout: progress header ---- */
  .workout-topbar { gap: 10px; }
  .wk-vol {
    font-family: var(--font-display); font-size: 13px; color: var(--accent);
    font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 4px;
  }
  .wk-track {
    height: 4px; background: var(--surface2); border-radius: 3px;
    overflow: hidden; margin: -6px 0 14px;
  }
  .wk-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.35s ease; }

  /* ---- collapsed finished exercise ---- */
  .done-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
  }
  .done-row { display: flex; align-items: center; gap: 9px; }
  .done-tick {
    width: 19px; height: 19px; flex-shrink: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
  }
  .done-name {
    font-family: var(--font-display); font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.03em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .done-sum {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }

  /* ---- same again ---- */
  .same-again {
    width: 100%; margin-top: 8px;
    background: var(--surface2); border: 1px dashed var(--accent);
    color: var(--accent); border-radius: 10px; padding: 10px;
    font-size: 12.5px; font-weight: 700;
  }
  .same-again b { font-family: var(--font-display); font-size: 14px; }
  .same-again:active { background: var(--accent); color: var(--accent-ink); }

  .tabbar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .tab {
    flex: 1; padding: 12px 0 10px;
    background: none; border: none;
    color: var(--faint);
    font-family: var(--font-body);
    font-weight: 700; font-size: 10px;
    letter-spacing: 0.01em;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .tab .ic { font-size: 18px; }
  .tab.active { color: var(--accent); }

  /* ---------- generic ---------- */
  .stat-num {
    font-family: var(--font-display);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block;
    background: var(--surface2);
    color: var(--muted);
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px;
    letter-spacing: 0.02em;
  }
  button { font-family: var(--font-body); cursor: pointer; }
  button.big-cta {
    background: var(--accent); color: var(--accent-ink);
    border: none; width: 100%;
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    padding: 17px; border-radius: 14px;
    letter-spacing: 0.01em;
  }
  button.big-cta:active { transform: scale(0.98); }
  button.secondary {
    background: var(--surface2); color: var(--ink);
    border: 1px solid var(--border);
    font-weight: 600; font-size: 13px;
    padding: 10px 14px; border-radius: 10px;
  }
  button.ghost { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px; }
  button.ghost.danger { color: var(--danger); }
  input[type="text"], input[type="number"], select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 10px;
    width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .empty-state { padding: 46px 10px; text-align: center; color: var(--muted); }
  .empty-state p { margin: 6px 0 20px; font-size: 14px; line-height: 1.5; }
  .section-title {
    font-family: var(--font-display); font-weight: 600; font-size: 13px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ---------- home ---------- */
  .home-header { margin-bottom: 18px; }
  .home-header .greet { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
  .home-header .date { color: var(--muted); font-size: 13px; }
  .routine-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 14px;
  }
  .routine-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 13px; padding: 12px 13px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    text-align: left; color: var(--ink);
    transition: background 0.12s, border-color 0.12s;
  }
  .routine-tile .rt-name {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
  }
  .routine-tile .rt-sub { font-size: 11px; color: var(--muted); font-weight: 600; }
  .routine-tile.active {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .routine-tile.active .rt-sub { color: var(--accent-ink); opacity: 0.75; }
  .routine-tile:active { transform: scale(0.98); }
  .today-card .routine-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-bottom: 2px; }
  .today-card .ex-preview { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat-box .stat-num { font-size: 26px; display: block; }
  .stat-box .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .bw-box { display: flex; justify-content: space-between; align-items: center; }
  .bw-box .stat-num { font-size: 26px; }
  .week-spark { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-top: 10px; }
  .week-spark .bar { flex: 1; background: var(--surface2); border-radius: 3px; position: relative; }
  .week-spark .bar.filled { background: var(--accent); }
  .week-spark .lbl { font-size: 9px; color: var(--faint); text-align: center; margin-top: 3px; }

  /* ---------- workout screen ---------- */
  .workout-topbar {
    position: sticky; top: 0; background: var(--bg);
    padding: 4px 0 12px; display: flex; justify-content: space-between; align-items: center;
    z-index: 5;
  }
  .elapsed { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rest-banner {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 9px 13px;
    display: flex; justify-content: space-between; align-items: center;
    margin: 8px 0 2px;
  }
  .rest-banner .rt { font-family: var(--font-display); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rest-banner button { background: rgba(0,0,0,0.15); border: none; color: var(--accent-ink); font-weight: 700; font-size: 12px; padding: 7px 12px; border-radius: 8px; }

  .ex-card { margin-bottom: 16px; }
  .ex-card .ex-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .ex-card .last-time { font-size: 12px; color: var(--muted); margin: 2px 0 12px; }
  .set-line {
    display: grid;
    grid-template-columns: 16px 1.45fr 1fr 38px;
    align-items: center; gap: 8px;
    padding: 6px 0;
  }
  .set-line.hold { grid-template-columns: 16px 1fr 38px; }
  .set-line .sidx { color: var(--faint); font-size: 12px; font-weight: 700; }
  .set-line.done { opacity: 0.55; }
  .set-line.active .sidx { color: var(--accent); }
  .check-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .check-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .add-set-link { font-size: 12px; color: var(--accent); background: none; border: none; font-weight: 700; padding: 6px 0; }
  .ex-remove { text-align: right; margin-top: 2px; }

  .add-ex-box { margin-top: 6px; }
  .search-results { max-height: 220px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; }
  .search-item { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .search-item:last-child { border-bottom: none; }
  .search-item .m { font-size: 11px; color: var(--muted); }

  .finish-bar { display: flex; gap: 10px; margin-top: 20px; }
  .finish-bar button.big-cta { flex: 2; }
  .finish-bar button.secondary { flex: 1; }

  /* ---------- finish overlay ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(6,7,8,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .finish-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 360px;
    text-align: center;
  }
  .finish-card .fire { font-size: 34px; margin-bottom: 4px; }
  .finish-card h2 { font-family: var(--font-display); font-size: 22px; margin-bottom: 20px; }
  .finish-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .finish-grid .fstat-num { font-size: 22px; }
  .finish-grid .fstat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .finish-vol { font-size: 30px; margin-bottom: 4px; }
  .finish-vol-lbl { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .pr-line { color: var(--gold); font-weight: 700; font-size: 14px; margin-bottom: 18px; }

  /* ---------- exercises tab ---------- */
  .ex-list-item {

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ============ storage: local fallback ============ */
  var LS_W = "repledger_workouts_v2", LS_BW = "repledger_bw_v2", LS_CE = "repledger_customex_v2";
  function localLoad() {
    try { state.workouts = JSON.parse(localStorage.getItem(LS_W) || "[]"); } catch (e) { state.workouts = []; }
    try { state.bodyweights = JSON.parse(localStorage.getItem(LS_BW) || "[]"); } catch (e) { state.bodyweights = []; }
    try { state.customExercises = JSON.parse(localStorage.getItem(LS_CE) || "{}"); } catch (e) { state.customExercises = {}; }

  }
  function localSaveW() { localStorage.setItem(LS_W, JSON.stringify(state.workouts)); }
  function localSaveBW() { localStorage.setItem(LS_BW, JSON.stringify(state.bodyweights)); }
  function localSaveCE() { localStorage.setItem(LS_CE, JSON.stringify(state.customExercises)); }

  var db = null;

  var store = {
    async saveWorkout(w) {
      w.createdAt = Date.now();
      if (db) { var ref = await db.collection("workouts").add(w); w.id = ref.id; }
      else { w.id = uid(); state.workouts.unshift(w); localSaveW(); }
    },
    async deleteWorkout(id) {
      if (db) await db.doc("workouts/" + id).delete();
      else { state.workouts = state.workouts.filter(function (w) { return w.id !== id; }); localSaveW(); }
    },
    async logBodyweight(weight) {
      var entry = { weight: weight, date: new Date().toISOString(), createdAt: Date.now() };
      if (db) { var ref = await db.collection("bodyweight").add(entry); entry.id = ref.id; state.bodyweights.unshift(entry); }
      else { entry.id = uid(); state.bodyweights.unshift(entry); localSaveBW(); }
    },
    async addCustomExercise(name, muscle) {

      if (db) { try { await db.doc("meta/customExercises").set({ map: state.customExercises }); } catch (e) {} }
      else localSaveCE();

  /* ---- in-progress workout is saved continuously, not just on Finish ---- */
  var LS_DRAFT = "repledger_active_v1";

  function saveDraft() {
    if (!state.activeWorkout) return;
    try { localStorage.setItem(LS_DRAFT, JSON.stringify(state.activeWorkout)); } catch (e) {}
    if (db) {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(function () {
        try { db.doc("drafts/active").set(state.activeWorkout); } catch (e) {}
      }, 1500);
    }
  }

  function clearDraft() {
    clearTimeout(draftTimer);
    try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
    if (db) { try { db.doc("drafts/active").delete(); } catch (e) {} }
  }

  async function restoreDraft() {
    if (state.activeWorkout) return;
    var d = null;
    try { d = JSON.parse(localStorage.getItem(LS_DRAFT) || "null"); } catch (e) {}
    if (!d && db) {
      try { var snap = await db.doc("drafts/active").get(); if (snap.exists) d = snap.data(); } catch (e) {}
    }
    if (!d || !d.exercises || !d.startedAt) return;
    // anything older than 12h is stale - drop it rather than resurrect yesterday's session
    if (Date.now() - d.startedAt > 12 * 3600 * 1000) { clearDraft(); return; }
    state.activeWorkout = d;
    state.viewingWorkout = false;
    render();
  }

  function sortWorkouts() { state.workouts.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }); }
  function sortBW() { state.bodyweights.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }); }

  async function initDb() {
    db = await window.claude.use("db");
    state.dbAvailable = !!db;
    if (!db) { localLoad(); render(); restoreDraft(); return; }
    try {
      var ceSnap = await db.doc("meta/customExercises").get();
      if (ceSnap.exists) { var d = ceSnap.data(); state.customExercises = d.map || {}; }
    } catch (e) {}
    loadGoalsLocal();
    try {
      var gSnap = await db.doc("goals/main").get();
      if (gSnap.exists) {
        var gd = gSnap.data();
        state.goals = { bodyweight: gd.bodyweight || null, bodyweightStart: gd.bodyweightStart || null,
                        perWeek: gd.perWeek || null, lifts: gd.lifts || [] };
      }
    } catch (e) {}
    db.collection("workouts").orderBy("createdAt", "desc").limit(80).onSnapshot(function (snap) {
      state.workouts = snap.docs.map(function (d) {
        var b = d.data() || {};
        return { id: d.id, date: b.date, createdAt: b.createdAt, durationSec: b.durationSec || 0, exercises: b.exercises || [] };
      });
      sortWorkouts();
      render();
      restoreDraft();
    }, function () { render(); });
    db.collection("bodyweight").orderBy("createdAt", "desc").limit(200).onSnapshot(function (snap) {
      state.bodyweights = snap.docs.map(function (d) {
        var b = d.data() || {};
        return { id: d.id, date: b.date, createdAt: b.createdAt, weight: b.weight };
      });
      sortBW();
      render();
    }, function () {});
  }

  // Boot runs LAST (see bottom of this script). Calling it here would execute
  // before later `var` assignments exist, which breaks the no-cloud-storage path.
  function boot() {
    if (window.claude && typeof window.claude.use === "function") initDb();
    else { localLoad(); state.dbAvailable = false; render(); restoreDraft(); }
  }

  /* ============ helpers ============ */
  function exerciseDef(name) {
    return EXERCISES.find(function (e) { return e.name.toLowerCase() === name.toLowerCase(); }) || null;
  }
  function isHold(name) {
    var d = exerciseDef(name);
    return !!(d && d.hold);
  }
  function defaultHold(name) {
    var d = exerciseDef(name);
    return d && d.hold ? d.hold : 30;
  }
  function unitOf(name) {
    var d = exerciseDef(name);
    return (d && d.unit) ? d.unit : "s";
  }

  function muscleOf(name) {
    var found = EXERCISES.find(function (e) { return e.name.toLowerCase() === name.toLowerCase(); });
    if (found) return found.muscle;
    return state.customExercises[name] || "Other";
  }
  function fmtW(w) { var n = Number(w); return isNaN(n) ? "-" : (n % 1 === 0 ? n : n.toFixed(1)); }
  function setsSummary(sets, name) {
    if (!sets || !sets.length) return "-";
    if (name && isHold(name)) {
      var u = unitOf(name);
      return sets.map(function (s) { return s.reps + u; }).join(", ");
    }
    return sets.map(function (s) { return fmtW(s.weight) + "kg\u00d7" + s.reps; }).join(", ");
  }
  function sessionVolume(ex) { return (ex.sets || []).reduce(function (s, x) { return s + (Number(x.weight) || 0) * (Number(x.reps) || 0); }, 0); }
  function workoutVolume(w) { return (w.exercises || []).reduce(function (s, ex) { return s + sessionVolume(ex); }, 0); }
  function workoutSetCount(w) { return (w.exercises || []).reduce(function (n, ex) { return n + (ex.sets ? ex.sets.length : 0); }, 0); }
  function shortDate(iso) { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  function fmtDuration(sec) { if (!sec) return "\u2014"; var m = Math.round(sec / 60); return m + " min"; }
  function fmtClock(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function bestWeightBefore(exerciseName, excludeWorkoutId) {
    var best = 0;
    state.workouts.forEach(function (w) {
      if (w.id === excludeWorkoutId) return;
      (w.exercises || []).forEach(function (ex) {
        if (ex.name.toLowerCase() === exerciseName.toLowerCase()) {
          (ex.sets || []).forEach(function (s) { if (Number(s.weight) > best) best = Number(s.weight); });
        }
      });
    });
    return best;
  }
  function findLastInstance(exerciseName, excludeWorkoutId) {
    var norm = exerciseName.toLowerCase();
    for (var i = 0; i < state.workouts.length; i++) {
      var w = state.workouts[i];
      if (excludeWorkoutId && w.id === excludeWorkoutId) continue;
      for (var j = 0; j < w.exercises.length; j++) {
        if (w.exercises[j].name.toLowerCase() === norm) return w.exercises[j];
      }
    }
    return null;
  }
  function allExerciseNames() {
    var set = {};
    EXERCISES.forEach(function (e) { set[e.name] = true; });
    Object.keys(state.customExercises).forEach(function (n) { set[n] = true; });
    state.workouts.forEach(function (w) { w.exercises.forEach(function (ex) { set[ex.name] = true; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function startOfWeek(d) {
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    var r = new Date(d); r.setDate(d.getDate() + diff); r.setHours(0,0,0,0); return r;
  }

  /* ============ rest timer ============ */
  function startRestTimer(exIdx) {
    state.restEndsAt = Date.now() + REST_SECONDS * 1000;
    state.restExIdx = (exIdx === undefined) ? null : exIdx;
    if (state.restTimerHandle) clearInterval(state.restTimerHandle);
    state.restTimerHandle = setInterval(function () {
      if (!state.restEndsAt) { stopRestTimer(); return; }
      var remain = Math.ceil((state.restEndsAt - Date.now()) / 1000);
      if (remain <= 0) {
        state.restEndsAt = null;
        state.restExIdx = null;
        stopRestTimer();
        // one redraw to remove the banner; drafts live in state so nothing is lost
        if (state.activeWorkout && state.viewingWorkout) renderWorkoutScreen();
        return;
      }
      var el = document.querySelector(".rest-banner .rt");
      if (el) el.textContent = fmtClock(remain);
    }, 1000);
  }
  function stopRestTimer() {
    if (state.restTimerHandle) { clearInterval(state.restTimerHandle); state.restTimerHandle = null; }
  }
  function skipRest() {
    state.restEndsAt = null;
    state.restExIdx = null;
    stopRestTimer();
    renderWorkoutScreen();
  }

  function startElapsedTimer() {
    stopElapsedTimer();

      if (!state.activeWorkout) { stopElapsedTimer(); return; }
      var el = document.querySelector(".elapsed");
      if (el) el.textContent = fmtClock(Math.floor((Date.now() - state.activeWorkout.startedAt) / 1000));

    if (state.elapsedHandle) { clearInterval(state.elapsedHandle); state.elapsedHandle = null; }

  /* ============ svg helpers ============ */
  function sparkline(values, w, h, color) {
    if (!values.length) return '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>';
    var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    if (max === min) { max += 1; min -= 1; }
    var step = values.length > 1 ? w / (values.length - 1) : 0;
    var pts = values.map(function (v, i) {
      var x = i * step;
      var y = h - ((v - min) / (max - min)) * (h - 8) - 4;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }
  function youtubeLinkHtml(name) {
    var q = encodeURIComponent(name + " proper form technique");
    return '<a class="yt-link" href="https://www.youtube.com/results?search_query=' + q + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="yt-ic">\u25B6</span><span>Watch a demo on YouTube</span><span class="yt-go">\u2197</span></a>';
  }


  /* ============ render root ============ */
  function render() {
    updateTopbar();
    var tabChanged = state.lastTab !== state.tab;
    state.lastTab = state.tab;
    var oldBar = document.querySelector(".resume-bar");
    if (oldBar) oldBar.remove();
    if (state.finishSummary) { renderFinishOverlay(); return; }
    if (state.activeWorkout && state.viewingWorkout) { renderWorkoutScreen(); return; }
    stopElapsedTimer();
    if (state.tab === "home") renderHome();
    else if (state.tab === "exercises") renderExercisesTab();
    else if (state.tab === "history") renderHistory();
    else if (state.tab === "goals") renderGoals();
    else renderProgress();
    if (tabChanged) {
      view.classList.remove("screen-in");
      void view.offsetWidth;
      view.classList.add("screen-in");
    }
    if (state.activeWorkout) renderResumeBar();
  }

  function renderResumeBar() {
    var bar = document.createElement("button");
    bar.className = "resume-bar";
    bar.innerHTML = '<span>Workout in progress</span><span class="resume-cta">Resume \u203a</span>';
    document.getElementById("app").appendChild(bar);
    bar.addEventListener("click", function () {
      state.viewingWorkout = true;
      render();
    });
  }

  /* ---- progression: XP, levels, streaks ---- */
  function xpStats() {
    var chrono = state.workouts.slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    var sets = 0, prs = 0, best = {};
    chrono.forEach(function (w) {
      (w.exercises || []).forEach(function (ex) {
        sets += (ex.sets || []).length;
        if (isHold(ex.name)) return;
        var top = (ex.sets || []).reduce(function (m, x) { return Math.max(m, Number(x.weight) || 0); }, 0);
        if (top <= 0) return;
        if (best[ex.name] === undefined) best[ex.name] = top;
        else if (top > best[ex.name]) { prs++; best[ex.name] = top; }
      });
    });
    var xp = chrono.length * 50 + sets * 5 + prs * 100;
    var lvl = 1;
    while (xp >= 100 * lvl * (lvl + 1) / 2) lvl++;
    var floor = 100 * (lvl - 1) * lvl / 2;
    var ceil = 100 * lvl * (lvl + 1) / 2;
    return { xp: xp, level: lvl, into: xp - floor, need: ceil - floor,
             pct: Math.min(100, Math.round((xp - floor) / (ceil - floor) * 100)),
             prs: prs, sets: sets, workouts: chrono.length };
  }

  function dayStreak() {
    var days = {};
    state.workouts.forEach(function (w) { days[new Date(w.date).toDateString()] = true; });
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!days[d.toDateString()]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (days[d.toDateString()]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function workoutsThisWeek() {
    var ws = startOfWeek(new Date());
    return state.workouts.filter(function (w) { return new Date(w.date) >= ws; }).length;
  }

  function workoutsThisMonth() {
    var n = new Date();
    return state.workouts.filter(function (w) {
      var d = new Date(w.date);
      return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
    }).length;
  }

  function currentBestFor(name) {
    var best = 0;
    state.workouts.forEach(function (w) {
      (w.exercises || []).forEach(function (ex) {
        if (ex.name.toLowerCase() !== name.toLowerCase()) return;
        (ex.sets || []).forEach(function (s) { if (Number(s.weight) > best) best = Number(s.weight); });
      });
    });
    return best;
  }

  function activeGoalCount() {
    var g = state.goals || {};
    return (g.bodyweight ? 1 : 0) + (g.perWeek ? 1 : 0) + ((g.lifts || []).length);
  }

  async function saveGoals() {
    try { localStorage.setItem("repledger_goals_v1", JSON.stringify(state.goals)); } catch (e) {}
    if (db) { try { await db.doc("goals/main").set(state.goals); } catch (e) {} }
  }

  function loadGoalsLocal() {
    try {
      var g = JSON.parse(localStorage.getItem("repledger_goals_v1") || "null");
      if (g) state.goals = { bodyweight: g.bodyweight || null, perWeek: g.perWeek || null, lifts: g.lifts || [] };
    } catch (e) {}
  }

  /* ---- history summarising ---- */
  // MET values (Compendium of Physical Activities). Resistance training sits ~5.0;
  // these drive a body-weight based estimate, never a measurement.
  var MET_BY_NAME = { "Running": 9.8, "Cycling": 7.0, "Rowing": 7.0, "Jump Rope": 12.3, "Stair Climber": 9.0 };
  function metFor(name) {
    if (MET_BY_NAME[name]) return MET_BY_NAME[name];
    var m = muscleOf(name);
    if (m === "Mobility") return 2.3;
    if (m === "Cardio") return 7.0;
    return 5.0;
  }

  function latestBodyweight() {
    return state.bodyweights && state.bodyweights[0] ? Number(state.bodyweights[0].weight) : null;
  }

  // returns null when body weight is unknown - we show a dash rather than invent a number
  function estimateCalories(w) {
    var bw = latestBodyweight();
    if (!bw) return null;
    var kcal = 0, timedMin = 0, liftSets = 0;
    (w.exercises || []).forEach(function (ex) {
      var sets = ex.sets || [];
      if (isHold(ex.name)) {
        var mins = sets.reduce(function (t, s) {
          var v = Number(s.reps) || 0;
          return t + (unitOf(ex.name) === "min" ? v : v / 60);
        }, 0);
        timedMin += mins;
        kcal += metFor(ex.name) * 3.5 * bw / 200 * mins;
      } else {
        liftSets += sets.length;
      }
    });
    var leftoverMin = w.durationSec ? Math.max(0, w.durationSec / 60 - timedMin) : liftSets * 2.5;
    var leftoverMet = 5.0;
    if (liftSets === 0) {
      var mets = (w.exercises || []).map(function (ex) { return metFor(ex.name); });
      leftoverMet = mets.length ? mets.reduce(function (x, y) { return x + y; }, 0) / mets.length : 2.3;
    }
    kcal += leftoverMet * 3.5 * bw / 200 * leftoverMin;
    return Math.round(kcal);
  }

  function muscleTally(w) {
    var counts = {};
    (w.exercises || []).forEach(function (ex) {
      var m = muscleOf(ex.name);
      counts[m] = (counts[m] || 0) + (ex.sets ? ex.sets.length : 0);
    });
    return counts;
  }

  function sessionName(w) {
    var counts = muscleTally(w);
    var keys = Object.keys(counts).filter(function (k) { return counts[k] > 0; });
    if (!keys.length) return "Workout";
    var lifting = keys.filter(function (k) { return k !== "Cardio" && k !== "Mobility"; });
    if (!lifting.length) return keys.indexOf("Cardio") >= 0 ? "Cardio" : "Mobility";
    var has = {};
    lifting.forEach(function (k) { has[k] = true; });
    if (lifting.length >= 4) return "Full Body";
    if (has.Chest && (has.Shoulders || has.Arms) && !has.Back) return "Push";
    if (has.Back && !has.Chest) return "Pull";
    var sorted = lifting.sort(function (a, b) { return counts[b] - counts[a]; });
    if (sorted[0] === "Legs") return "Legs";
    return sorted.slice(0, 2).join(" & ");
  }

  function muscleTags(w, max) {
    var counts = muscleTally(w);
    return Object.keys(counts)
      .filter(function (k) { return counts[k] > 0; })
      .sort(function (a, b) { return counts[b] - counts[a]; })
      .slice(0, max || 3);
  }

  function relDate(iso) {
    var d = new Date(iso); d.setHours(0, 0, 0, 0);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var days = Math.round((t - d) / 86400000);
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    if (days < 7) return days + " days ago";
    return shortDate(iso);
  }

  // the set you'd actually remember: heaviest lift, else longest timed effort
  function topSetLabel(w) {
    var lift = null, timed = null;
    (w.exercises || []).forEach(function (ex) {
      (ex.sets || []).forEach(function (s) {
        if (isHold(ex.name)) {
          var v = Number(s.reps) || 0;
          if (!timed || v > timed.val) timed = { name: ex.name, val: v, unit: unitOf(ex.name) };
        } else {
          var wt = Number(s.weight) || 0;
          if (wt > 0 && (!lift || wt > lift.val)) lift = { name: ex.name, val: wt, reps: s.reps };
        }
      });
    });
    if (lift) return lift.name + " " + fmtW(lift.val) + " \u00d7 " + lift.reps;
    if (timed) return timed.name + " " + timed.val + timed.unit;
    return null;
  }

  function forgeMark() {
    return '<svg class="tb-mark" viewBox="0 0 40 40" aria-hidden="true">' +
      '<path d="M20 3.5 A16.5 16.5 0 0 1 35.6 14.6" fill="none" stroke="var(--accent)" stroke-width="4.2" stroke-linecap="round"/>' +
      '<path d="M36.2 20.8 A16.5 16.5 0 0 1 24.6 35.9" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/>' +
      '<path d="M17.2 36.2 A16.5 16.5 0 0 1 4.3 25.4" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M4.1 17.4 A16.5 16.5 0 0 1 10.6 6.9" fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round"/>' +
      '<path d="M15.2 10.5 L28 10.5 L26 15.2 L19.6 15.2 L19 19.4 L24.6 19.4 L22.8 24 L18.3 24 L16.4 31.5 L11.6 31.5 Z" fill="var(--ink)"/>' +
      '</svg>';
  }

  /* ---- keep the page where the user left it across re-renders ---- */
  function paint(fn) {
    var y = view.scrollTop;
    fn();
    view.scrollTop = y;
  }

  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (e) {}
  }

  /* ---- sticky banner, same on every screen ---- */
  function updateTopbar() {
    var bar = document.getElementById("topbar");
    if (!bar) return;
    var title = "Forge", right = "", momentum = "";

    if (state.activeWorkout && state.viewingWorkout) {
      var w = state.activeWorkout;
      title = sessionName(w) === "Workout" ? "Workout" : sessionName(w);
      right = '<span class="elapsed">' +
        (w.backdated ? shortDate(w.date) : fmtClock(Math.floor((Date.now() - w.startedAt) / 1000))) + '</span>';
    } else if (state.tab === "home") {
      var x = xpStats(), streak = dayStreak(), wk = workoutsThisWeek();
      right = '<span class="tb-right">' + new Date().toLocaleDateString(undefined, { day: "numeric", month: "short" }) + '</span>';
      momentum = '<div class="momentum">' +
        '<div class="mo-row"><span class="mo-lvl">Level ' + x.level + '</span>' +
          '<span class="mo-xp">' + x.into + ' / ' + x.need + ' XP</span></div>' +
        '<div class="mo-track"><div class="mo-fill" style="width:' + x.pct + '%"></div></div>' +
        '<div class="mo-sub">' + wk + ' this week' +
          (streak > 1 ? ' \u00b7 ' + streak + '-day streak \ud83d\udd25' : '') +
          (x.prs ? ' \u00b7 ' + x.prs + ' PRs' : '') + '</div>' +
        '</div>';
    } else if (state.tab === "exercises") {
      title = state.exDetailName ? "Exercise" : "Exercises";
      right = '<span class="tb-right">' + allExerciseNames().length + ' total</span>';
    } else if (state.tab === "history") {
      title = "History";
      right = '<span class="tb-right">' + workoutsThisMonth() + ' this month</span>';
    } else if (state.tab === "progress") {
      title = "Progress";
      var bw = latestBodyweight();
      right = '<span class="tb-right">' + (bw ? fmtW(bw) + ' kg' : '\u2014') + '</span>';
    } else if (state.tab === "goals") {
      title = "Goals";
      right = '<span class="tb-right">' + activeGoalCount() + ' active</span>';
    }

    var isHome = (state.tab === "home" && !(state.activeWorkout && state.viewingWorkout));
    bar.innerHTML = '<div class="tb-main">' +
      '<span class="tb-brand">' + (isHome ? forgeMark() : '') +
        '<span class="tb-title' + (isHome ? ' wordmark' : '') + '">' + escapeHtml(title) + '</span></span>' +
      right + '</div>' + momentum;
  }

  /* ============ HOME ============ */
  function renderHome() {
    var g = state.goals || {};
    var html = "";
    if (state.dbAvailable === false) html += '<div class="offline-note">Saved on this device only \u2014 storage isn\u2019t connected.</div>';

    // --- 1. routine collapsed to one row; Start sits high on the screen ---
    var preview = ROUTINES[state.selectedRoutine] || [];
    var label = state.selectedRoutine === "Quick" ? "Quick Workout" : state.selectedRoutine + " Day";
    html += '<div class="card today-card">' +
      '<button class="routine-switch" id="routineSwitch">' +
        '<span class="rs-eyebrow">Today</span>' +
        '<span class="rs-name">' + escapeHtml(label) + '</span>' +
        '<span class="rs-chev">\u25BE</span>' +
      '</button>';

    // --- 3. preview shows last session's numbers, not just names ---
    if (preview.length) {
      var lines = preview.slice(0, 4).map(function (n) {
        var prev = findLastInstance(n);
        if (prev && prev.sets && prev.sets.length) {
          var best = prev.sets.reduce(function (m, x) {
            return (Number(x.weight) || 0) >= (Number(m.weight) || 0) ? x : m;
          }, prev.sets[0]);
          var val = isHold(n) ? best.reps + unitOf(n) : fmtW(best.weight) + "\u00d7" + best.reps;
          return '<div class="tgt-row"><span class="tgt-name">' + escapeHtml(n) + '</span>' +
                 '<span class="tgt-val">' + val + '</span></div>';
        }
        return '<div class="tgt-row"><span class="tgt-name">' + escapeHtml(n) + '</span>' +
               '<span class="tgt-val new">new</span></div>';
      }).join("");
      html += '<div class="target-list">' + lines +
        (preview.length > 4 ? '<div class="tgt-more">+' + (preview.length - 4) + ' more</div>' : '') +
        '</div>' +
        '<div class="tgt-caption">Last time \u2014 beat it</div>';
    } else {
      html += '<div class="ex-preview">Add exercises as you go</div>';
    }
    html += '<button class="big-cta" id="startBtn">Start Workout</button></div>';

    // routine picker, hidden until asked for
    if (state.routinePickerOpen) {
      html += '<div class="routine-grid">';
      ROUTINE_ORDER.forEach(function (r) {
        var list = ROUTINES[r] || [];
        var sub = list.length ? list.length + " exercises" : (r === "Quick" ? "Build as you go" : "Add your own");
        html += '<button class="routine-tile' + (state.selectedRoutine === r ? ' active' : '') + '" data-routine="' + r + '">' +
          '<span class="rt-name">' + r + '</span><span class="rt-sub">' + sub + '</span></button>';
      });
      html += '</div>';
    }

    // --- 5. Last Workout moved up, directly under the session card ---
    var last = state.workouts[0];
    html += '<div class="section-title">Last Workout</div>';
    if (last) {
      var lastKcal = estimateCalories(last);
      var lastTop = topSetLabel(last);
      html += '<div class="card last-card"><div class="row-between">' +
        '<div><div class="hist-title"><span class="hist-name">' + escapeHtml(sessionName(last)) + '</span>' +
          '<span class="hist-when">' + relDate(last.date) + '</span></div>' +
        '<div class="muted" style="font-size:12px;margin-top:3px">' + workoutSetCount(last) + (workoutSetCount(last) === 1 ? ' set' : ' sets') +
          (lastTop ? ' \u00b7 ' + escapeHtml(lastTop) : '') + '</div></div>' +
        '<div class="hist-kcal">' + (lastKcal !== null ? '<span class="stat-num">~' + lastKcal + '</span><span class="kcal-u">kcal</span>' : '<span class="kcal-na">\u2014</span>') + '</div>' +
        '</div></div>';
    } else {
      html += '<div class="card muted" style="text-align:center;padding:20px">No workouts yet</div>';
    }

    // --- 4. body weight folded into a compact stats row (2 = no repeated week count) ---
    var bw = state.bodyweights[0];
    var trend = "";
    if (state.bodyweights.length > 1) {
      var diff = Number(bw.weight) - Number(state.bodyweights[state.bodyweights.length - 1].weight);
      if (Math.abs(diff) >= 0.1) trend = (diff > 0 ? "\u2191" : "\u2193") + fmtW(Math.abs(Math.round(diff * 10) / 10));
    }
    var streak = dayStreak();
    html += '<div class="quick-row">' +
      '<button class="quick-stat" id="logBwBtn">' +
        '<span class="qs-val">' + (bw ? fmtW(bw.weight) : "\u2014") + '<span class="qs-unit">kg</span></span>' +
        '<span class="qs-lbl">Weight ' + (trend ? '<span class="qs-trend">' + trend + '</span>' : '<span class="qs-add">+</span>') + '</span>' +
      '</button>' +
      '<div class="quick-stat"><span class="qs-val">' + streak + '</span><span class="qs-lbl">Day streak</span></div>' +
      '<div class="quick-stat"><span class="qs-val">' + state.workouts.length + '</span><span class="qs-lbl">Total sessions</span></div>' +
      '</div>';

    // week chart kept, but the count itself lives in the banner now
    var now = new Date();
    var thisWeekStart = startOfWeek(now);
    var lastWeekStart = new Date(thisWeekStart); lastWeekStart.setDate(lastWeekStart.getDate() - 7);
    var thisWeekCount = 0, lastWeekCount = 0;
    var dayVol = [0,0,0,0,0,0,0];
    state.workouts.forEach(function (w) {
      var d = new Date(w.date);
      if (d >= thisWeekStart) {
        thisWeekCount++;
        dayVol[(d.getDay() + 6) % 7] += workoutVolume(w);
      } else if (d >= lastWeekStart && d < thisWeekStart) lastWeekCount++;
    });
    var maxDay = Math.max.apply(null, dayVol.concat([1]));
    var dayLbls = ["M","T","W","T","F","S","S"];
    html += '<div class="section-title">This Week</div>';
    html += '<div class="card">' +
      '<div class="row-between" style="margin-bottom:2px">' +
        '<span class="muted" style="font-size:12px;font-weight:700">' +
          (g.perWeek ? thisWeekCount + ' of ' + g.perWeek + ' target' : 'Volume by day') + '</span>' +
        '<span class="pill">' + (thisWeekCount >= lastWeekCount ? "\u2191" : "\u2193") + ' vs ' + lastWeekCount + ' last week</span></div>' +
      '<div class="week-spark">' + dayVol.map(function (v) {
        var h = Math.max(4, Math.round((v / maxDay) * 40));
        return '<div class="bar' + (v > 0 ? ' filled' : '') + '" style="height:' + h + 'px"></div>';
      }).join("") + '</div>' +
      '<div class="week-spark">' + dayLbls.map(function (l) { return '<div class="lbl" style="flex:1">' + l + '</div>'; }).join("") + '</div>' +
      '</div>';

    view.innerHTML = html;

    document.getElementById("startBtn").addEventListener("click", function () {
      if (state.activeWorkout) { state.viewingWorkout = true; render(); return; }
      var exList = (ROUTINES[state.selectedRoutine] || []).map(function (name) { return { name: name, muscle: muscleOf(name), sets: [], plannedSets: isHold(name) ? 1 : 3 }; });
      state.activeWorkout = { date: new Date().toISOString(), startedAt: Date.now(), exercises: exList };
      state.viewingWorkout = true;
      saveDraft();
      render();
    });
    document.getElementById("logBwBtn").addEventListener("click", function () {
      var current = state.bodyweights[0] ? state.bodyweights[0].weight : "";
      showNumberPrompt("Log body weight", "kg", current, function (n) {
        store.logBodyweight(n).then(render);
      });
    });
    var switchBtn = document.getElementById("routineSwitch");
    if (switchBtn) switchBtn.addEventListener("click", function () {
      state.routinePickerOpen = !state.routinePickerOpen;
      render();
    });
    view.querySelectorAll("[data-routine]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.selectedRoutine = btn.getAttribute("data-routine");
        state.routinePickerOpen = false;
        render();
      });
    });
  }

  /* ============ WORKOUT (active session) ============ */
  function renderWorkoutScreen() {
    var w = state.activeWorkout;
    var html = "";

    var doneSets = 0, planSets = 0, liveVol = 0;
    w.exercises.forEach(function (ex) {
      var lastRef = findLastInstance(ex.name);
      var pc = ex.plannedSets || (lastRef ? lastRef.sets.length : (isHold(ex.name) ? 1 : 3)) || 3;
      planSets += Math.max(pc, ex.sets.length);
      (ex.sets || []).forEach(function (st) {
        if (st && st.done) {
          doneSets++;
          liveVol += (Number(st.weight) || 0) * (Number(st.reps) || 0);
        }
      });
    });
    var pctSets = planSets ? Math.round(doneSets / planSets * 100) : 0;
    html += '<div class="workout-topbar"><span class="wk-label">' + doneSets + ' of ' + planSets + ' sets</span>' +
      '<span class="wk-vol">' + Math.round(liveVol).toLocaleString() + ' kg</span>' +
      '<button class="ghost danger" id="cancelWorkoutBtn">Cancel</button></div>' +
      '<div class="wk-track"><div class="wk-fill" style="width:' + pctSets + '%"></div></div>';

    w.exercises.forEach(function (ex, exIdx) {
      var last = findLastInstance(ex.name);
      var hold = isHold(ex.name);
      var plannedCount = ex.plannedSets || (last ? last.sets.length : (hold ? 1 : 3)) || (hold ? 1 : 3);
      var firstUndoneIdx = -1;

      var plannedTotal = Math.max(plannedCount, ex.sets.length);
      var doneHere = (ex.sets || []).filter(function (st) { return st && st.done; }).length;
      var complete = doneHere > 0 && doneHere >= plannedTotal;
      var collapsed = complete && !state.expandedEx[exIdx];

      if (collapsed) {
        html += '<div class="ex-card done-card" data-expand="' + exIdx + '">' +
          '<div class="done-row">' +
            '<span class="done-tick">\u2713</span>' +
            '<span class="done-name">' + escapeHtml(ex.name) + '</span>' +
            '<span class="done-sum">' + escapeHtml(setsSummary(ex.sets.filter(function (st) { return st && st.done; }), ex.name)) + '</span>' +
          '</div></div>';
        return;
      }

      html += '<div class="ex-card"><div class="ex-name">' + escapeHtml(ex.name) + '</div>';
      html += '<div class="last-time">Last time: ' + (last ? escapeHtml(setsSummary(last.sets, ex.name)) : 'no previous data') + '</div>';

      for (var i = 0; i < Math.max(plannedCount, ex.sets.length); i++) {
        var defReps = last && last.sets[i] ? last.sets[i].reps : (hold ? defaultHold(ex.name) : "");
        var s = ex.sets[i] || { weight: last && last.sets[i] ? last.sets[i].weight : "", reps: defReps, done: false };
        if (!s.done && firstUndoneIdx === -1) firstUndoneIdx = i;
        var isActive = i === firstUndoneIdx;
        var flash = (state.flashSet === exIdx + ":" + i) ? " flash" : "";
        html += '<div class="set-line' + (hold ? ' hold' : '') + (s.done ? ' done' : '') + (isActive ? ' active' : '') + flash + '">' +
          '<span class="sidx">' + (i + 1) + '</span>' +
          (hold ? '' :
            '<span class="wt-cell">' +
              '<button class="step" data-step="' + exIdx + ':' + i + ':-1" ' + (s.done ? 'disabled' : '') + '>\u2212</button>' +
              '<input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="' + (s.weight === "" || s.weight === undefined ? "" : s.weight) + '" data-w="' + exIdx + ':' + i + '" ' + (s.done ? 'disabled' : '') + '>' +
              '<button class="step" data-step="' + exIdx + ':' + i + ':1" ' + (s.done ? 'disabled' : '') + '>+</button>' +
            '</span>') +
          '<input type="number" inputmode="numeric" placeholder="' + (hold ? (unitOf(ex.name) === "min" ? "minutes" : "seconds") : "reps") + '" value="' + (s.reps === "" || s.reps === undefined ? "" : s.reps) + '" data-r="' + exIdx + ':' + i + '" ' + (s.done ? 'disabled' : '') + '>' +
          '<button class="check-btn' + (s.done ? ' on' : '') + '" data-check="' + exIdx + ':' + i + '">\u2713</button>' +
          '</div>';
      }
      if (state.restEndsAt && state.restExIdx === exIdx) {
        var remain = Math.ceil((state.restEndsAt - Date.now()) / 1000);
        html += '<div class="rest-banner pulsing"><span>Rest \u2014 <span class="rt">' + fmtClock(remain) + '</span></span>' +
          '<button id="skipRestBtn">Skip</button></div>';
      }
      var lastDone = null;
      for (var z = (ex.sets || []).length - 1; z >= 0; z--) {
        if (ex.sets[z] && ex.sets[z].done) { lastDone = ex.sets[z]; break; }
      }
      if (lastDone && firstUndoneIdx >= 0) {
        var againLbl = hold ? lastDone.reps + unitOf(ex.name)
                            : fmtW(lastDone.weight) + " \u00d7 " + lastDone.reps;
        html += '<button class="same-again" data-again="' + exIdx + ':' + firstUndoneIdx + '">' +
          '\u21ba Same again \u00b7 <b>' + againLbl + '</b></button>';
      }
      html += '<button class="add-set-link" data-addset="' + exIdx + '">+ Add set</button>';
      html += '<div class="ex-remove"><button class="ghost danger" data-removeex="' + exIdx + '">Remove exercise</button></div>';
      html += '</div>';
    });

    html += '<div class="section-title">Add Exercise</div>';
    html += '<div class="add-ex-box"><input type="text" id="exSearch" placeholder="Search exercises\u2026" value="' + escapeHtml(state.exSearchQuery) + '" autocomplete="off"></div>';
    html += '<div id="exSearchWrap">' + searchResultsHtml() + '</div>';

    html += '<div class="finish-bar"><button class="big-cta" id="finishBtn">Finish Workout</button><button class="secondary" id="cancelWorkoutBtn2">Cancel</button></div>';

    var keepY = view.scrollTop;
    view.innerHTML = html;
    view.scrollTop = keepY;
    updateTopbar();

    // weight steppers: 2.5 kg a tap, no keyboard needed
    view.querySelectorAll("[data-step]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = btn.getAttribute("data-step").split(":");
        var exI = Number(p[0]), sI = Number(p[1]), dir = Number(p[2]);
        var target = w.exercises[exI];
        if (!target) return;
        var input = document.querySelector('[data-w="' + exI + ':' + sI + '"]');
        var cur = input && input.value !== "" ? Number(input.value) : 0;
        var next = Math.max(0, Math.round((cur + dir * 2.5) * 2) / 2);
        if (input) input.value = next;
        var st = target.sets[sI] || { weight: "", reps: "", done: false };
        st.weight = next;
        target.sets[sI] = st;
        saveDraft();
        buzz(8);
      });
    });

    if (state.focusNext) {
      var fp = state.focusNext.split(":");
      var nextInput = document.querySelector('[data-w="' + fp[0] + ':' + fp[1] + '"]') ||
                      document.querySelector('[data-r="' + fp[0] + ':' + fp[1] + '"]');
      if (nextInput) { try { nextInput.focus({ preventScroll: true }); } catch (e) { nextInput.focus(); } }
      state.focusNext = null;
    }

    if (!w.backdated) startElapsedTimer();
    if (!state.restEndsAt) stopRestTimer();

    document.getElementById("cancelWorkoutBtn").addEventListener("click", cancelWorkout);
    document.getElementById("cancelWorkoutBtn2").addEventListener("click", cancelWorkout);
    document.getElementById("finishBtn").addEventListener("click", finishWorkout);
    var skipBtn = document.getElementById("skipRestBtn");
    if (skipBtn) skipBtn.addEventListener("click", skipRest);

    var exSearch = document.getElementById("exSearch");
    exSearch.addEventListener("input", function (e) {
      state.exSearchQuery = e.target.value;
      updateSearchResults();
    });

    // drafts: anything typed is written straight into state
    view.querySelectorAll("[data-w], [data-r]").forEach(function (input) {
      input.addEventListener("input", function () {
        var isWeight = input.hasAttribute("data-w");
        var parts = input.getAttribute(isWeight ? "data-w" : "data-r").split(":");
        var exIdx = Number(parts[0]), sIdx = Number(parts[1]);
        var ex = w.exercises[exIdx];
        if (!ex) return;
        var s = ex.sets[sIdx] || { weight: "", reps: "", done: false };
        s[isWeight ? "weight" : "reps"] = input.value === "" ? "" : Number(input.value);
        ex.sets[sIdx] = s;
        saveDraft();
      });
    });

    var addCustomBtn = document.getElementById("addCustomBtn");
    if (addCustomBtn) addCustomBtn.addEventListener("click", addCustomFromSearch);
    bindSearchResults();
    view.querySelectorAll("[data-removeex]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        w.exercises.splice(Number(btn.getAttribute("data-removeex")), 1);
        saveDraft();
        renderWorkoutScreen();
      });
    });
    view.querySelectorAll("[data-expand]").forEach(function (card) {
      card.addEventListener("click", function () {
        var i = card.getAttribute("data-expand");
        state.expandedEx[i] = true;
        renderWorkoutScreen();
      });
    });

    view.querySelectorAll("[data-again]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = btn.getAttribute("data-again").split(":");
        var exI = Number(p[0]), sI = Number(p[1]);
        var ex = w.exercises[exI];
        if (!ex) return;
        var src = null;
        for (var z = ex.sets.length - 1; z >= 0; z--) {
          if (ex.sets[z] && ex.sets[z].done) { src = ex.sets[z]; break; }
        }
        if (!src) return;
        ex.sets[sI] = { weight: src.weight, reps: src.reps, done: true };
        saveDraft();
        buzz(18);
        state.flashSet = exI + ":" + sI;
        if (!isHold(ex.name)) startRestTimer(exI);
        renderWorkoutScreen();
        state.flashSet = null;
      });
    });

    view.querySelectorAll("[data-addset]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var exIdx = Number(btn.getAttribute("data-addset"));
        w.exercises[exIdx].plannedSets = Math.max(w.exercises[exIdx].plannedSets || 3, w.exercises[exIdx].sets.length) + 1;
        state.expandedEx[exIdx] = true;
        saveDraft();
        renderWorkoutScreen();
      });
    });
    view.querySelectorAll("[data-check]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-check").split(":");
        var exIdx = Number(parts[0]), sIdx = Number(parts[1]);
        var ex = w.exercises[exIdx];
        var wInput = document.querySelector('[data-w="' + exIdx + ':' + sIdx + '"]');
        var rInput = document.querySelector('[data-r="' + exIdx + ':' + sIdx + '"]');
        var weight = (!wInput || wInput.value === "") ? 0 : Number(wInput.value);
        var reps = rInput.value === "" ? 0 : Number(rInput.value);
        if (!reps) { rInput.focus(); return; }
        ex.sets[sIdx] = { weight: weight, reps: reps, done: true };
        saveDraft();
        buzz(18);
        state.flashSet = exIdx + ":" + sIdx;
        // hand focus to the next unfinished set so logging keeps flowing
        var planned = Math.max(ex.plannedSets || 0, ex.sets.length);
        var nextIdx = -1;
        for (var q = sIdx + 1; q < planned; q++) {
          if (!ex.sets[q] || !ex.sets[q].done) { nextIdx = q; break; }
        }
        state.focusNext = (nextIdx >= 0) ? exIdx + ":" + nextIdx : null;
        if (!isHold(ex.name)) startRestTimer(exIdx);
        renderWorkoutScreen();
        state.flashSet = null;
      });
    });
  }
  function searchResultsHtml() {
    var qRaw = state.exSearchQuery.trim();
    if (!qRaw) return "";
    var q = qRaw.toLowerCase();
    var matches = allExerciseNames().filter(function (n) { return n.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
    var out = '<div class="search-results">';
    matches.forEach(function (n) {
      out += '<div class="search-item" data-pick="' + escapeHtml(n) + '"><span>' + escapeHtml(n) + '</span><span class="m">' + muscleOf(n) + '</span></div>';
    });
    if (!matches.length) out += '<div class="search-item"><span class="m">No match \u2014 tap below to add it as custom</span></div>';
    out += '</div>';
    if (!matches.length) {
      out += '<button class="secondary" id="addCustomBtn" style="margin-top:8px;width:100%">Add "' + escapeHtml(qRaw) + '"</button>';
    }
    return out;
  }

  function addCustomFromSearch() {
    var name = state.exSearchQuery.trim();
    if (!name || !state.activeWorkout) return;
    store.addCustomExercise(name, "Other");
    state.activeWorkout.exercises.push({ name: name, muscle: "Other", sets: [], plannedSets: 3 });
    state.exSearchQuery = "";
    renderWorkoutScreen();
  }

  function bindSearchResults() {
    var wrap = document.getElementById("exSearchWrap");
    if (!wrap) return;
    wrap.querySelectorAll("[data-pick]").forEach(function (el) {
      el.addEventListener("click", function () {
        var name = el.getAttribute("data-pick");
        state.activeWorkout.exercises.push({ name: name, muscle: muscleOf(name), sets: [], plannedSets: isHold(name) ? 1 : 3 });
        state.exSearchQuery = "";
        saveDraft();
        renderWorkoutScreen();
      });
    });
    var btn = wrap.querySelector("#addCustomBtn");
    if (btn) btn.addEventListener("click", addCustomFromSearch);
  }

  // updates ONLY the results list, so set inputs and keyboard focus are untouched
  function updateSearchResults() {
    var wrap = document.getElementById("exSearchWrap");
    if (!wrap) return;
    wrap.innerHTML = searchResultsHtml();
    bindSearchResults();
  }

  function preserveFocus(el) { if (!el) return; el.focus(); var v = el.value; el.value = ""; el.value = v; }

  /* ---- in-app dialogs (confirm/prompt are blocked in this frame) ---- */
  function closeDialog() {
    var d = document.querySelector(".dialog-overlay");
    if (d) d.remove();
  }

  function showConfirm(title, body, confirmLabel, onConfirm) {
    closeDialog();
    var el = document.createElement("div");
    el.className = "dialog-overlay";
    el.innerHTML = '<div class="dialog">' +
      '<h3>' + escapeHtml(title) + '</h3>' +
      (body ? '<p>' + escapeHtml(body) + '</p>' : '') +
      '<div class="dialog-actions">' +
      '<button class="secondary" data-dlg="cancel">Keep going</button>' +
      '<button class="dialog-danger" data-dlg="ok">' + escapeHtml(confirmLabel) + '</button>' +
      '</div></div>';
    document.getElementById("app").appendChild(el);
    el.querySelector('[data-dlg="cancel"]').addEventListener("click", closeDialog);
    el.querySelector('[data-dlg="ok"]').addEventListener("click", function () {
      closeDialog();
      onConfirm();
    });
    el.addEventListener("click", function (e) { if (e.target === el) closeDialog(); });
  }

  function showPickPrompt(title, options, onSubmit) {
    closeDialog();
    var el = document.createElement("div");
    el.className = "dialog-overlay";
    el.innerHTML = '<div class="dialog">' +
      '<h3>' + escapeHtml(title) + '</h3>' +
      '<input type="text" id="pickSearch" placeholder="Search\u2026" autocomplete="off">' +
      '<div class="pick-list" id="pickList"></div>' +
      '<div class="dialog-actions"><button class="secondary" data-dlg="cancel">Cancel</button></div>' +
      '</div>';
    document.getElementById("app").appendChild(el);
    var listEl = el.querySelector("#pickList");
    var search = el.querySelector("#pickSearch");
    function paint() {
      var q = search.value.trim().toLowerCase();
      var shown = options.filter(function (o) { return !q || o.toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
      listEl.innerHTML = shown.map(function (o) {
        return '<div class="pick-item" data-pickval="' + escapeHtml(o) + '">' + escapeHtml(o) + '</div>';
      }).join("") || '<div class="pick-item muted">No match</div>';
      listEl.querySelectorAll("[data-pickval]").forEach(function (item) {
        item.addEventListener("click", function () {
          var v = item.getAttribute("data-pickval");
          closeDialog(); onSubmit(v);
        });
      });

    paint();
    search.addEventListener("input", paint);
    el.querySelector('[data-dlg="cancel"]').addEventListener("click", closeDialog);
    el.addEventListener("click", function (e) { if (e.target === el) closeDialog(); });

  function showDatePrompt(title, onSubmit) {
    closeDialog();
    var today = new Date();
    var iso = today.getFullYear() + "-" +
      String(today.getMonth() + 1).padStart(2, "0") + "-" +
      String(today.getDate()).padStart(2, "0");
    var el = document.createElement("div");
    el.className = "dialog-overlay";
    el.innerHTML = '<div class="dialog">' +
      '<h3>' + escapeHtml(title) + '</h3>' +
      '<p>Pick the day it happened.</p>' +
      '<input type="date" id="dlgDate" value="' + iso + '" max="' + iso + '">' +
      '<div class="dialog-actions">' +
      '<button class="secondary" data-dlg="cancel">Cancel</button>' +
      '<button class="dialog-ok" data-dlg="ok">Continue</button>' +
      '</div></div>';
    document.getElementById("app").appendChild(el);
    var input = el.querySelector("#dlgDate");
    el.querySelector('[data-dlg="cancel"]').addEventListener("click", closeDialog);
    el.querySelector('[data-dlg="ok"]').addEventListener("click", function () {
      if (!input.value) { input.focus(); return; }
      var parts = input.value.split("-");
      var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0);

  function showNumberPrompt(title, unit, initial, onSubmit) {
    closeDialog();
    var el = document.createElement("div");
    el.className = "dialog-overlay";
    el.innerHTML = '<div class="dialog">' +
      '<h3>' + escapeHtml(title) + '</h3>' +
      '<input type="number" inputmode="decimal" step="0.1" id="dlgInput" placeholder="' + escapeHtml(unit) + '" value="' + (initial || "") + '">' +
      '<div class="dialog-actions">' +
      '<button class="secondary" data-dlg="cancel">Cancel</button>' +
      '<button class="dialog-ok" data-dlg="ok">Save</button>' +
      '</div></div>';
    document.getElementById("app").appendChild(el);
    var input = el.querySelector("#dlgInput");
    input.focus();
    function submit() {
      var n = Number(input.value);
      if (!n || n <= 0) { input.focus(); return; }
      closeDialog();
      onSubmit(n);
    }
    el.querySelector('[data-dlg="cancel"]').addEventListener("click", closeDialog);
    el.querySelector('[data-dlg="ok"]').addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    el.addEventListener("click", function (e) { if (e.target === el) closeDialog(); });
  }

  function cancelWorkout() {
    showConfirm("Discard this workout?", "Nothing from this session will be saved.", "Discard", discardWorkout);
  }

  function discardWorkout() {
    clearDraft();
    stopRestTimer();
    stopElapsedTimer();
    state.restEndsAt = null;
    state.restExIdx = null;
    state.activeWorkout = null;
    state.viewingWorkout = false;
    render();
  }

  async function finishWorkout() {
    var w = state.activeWorkout;
    // a set counts if it was ticked OR simply filled in - typing the numbers is enough
    var cleanExercises = w.exercises.map(function (ex) {
      return { name: ex.name, sets: (ex.sets || []).filter(function (s) {
          return s && (s.done || Number(s.reps) > 0);
        }).map(function (s) { return { weight: Number(s.weight) || 0, reps: Number(s.reps) }; }) };
    }).filter(function (ex) { return ex.sets.length > 0; });

    // never bin a workout silently - say so and make the user choose
    if (cleanExercises.length === 0) {
      showConfirm("Nothing logged yet",
        "No sets have been filled in, so there's nothing to save. Discard this session?",
        "Discard", discardWorkout);
      return;
    }

    var durationSec = w.backdated ? 0 : Math.floor((Date.now() - w.startedAt) / 1000);
    var prCount = 0;
    cleanExercises.forEach(function (ex) {
      if (isHold(ex.name)) return;
      var prevBest = bestWeightBefore(ex.name);
      var newBest = Math.max.apply(null, ex.sets.map(function (s) { return Number(s.weight) || 0; }));
      if (newBest > prevBest) prCount++;
    });
    var totalVolume = cleanExercises.reduce(function (sum, ex) { return sum + sessionVolume(ex); }, 0);
    var totalSets = cleanExercises.reduce(function (n, ex) { return n + ex.sets.length; }, 0);

    var toSave = { date: w.date, durationSec: durationSec, exercises: cleanExercises };

    clearDraft();
    stopRestTimer();
    stopElapsedTimer();
    state.restEndsAt = null;
    state.restExIdx = null;
    state.activeWorkout = null;
    state.viewingWorkout = false;
    state.finishSummary = { durationSec: durationSec, sets: totalSets, exercises: cleanExercises.length, volume: totalVolume, prCount: prCount,
                            kcal: estimateCalories({ exercises: cleanExercises, durationSec: durationSec }) };
    render();
    await store.saveWorkout(toSave);
  }

      '<h2>Workout Complete</h2>' +
      '<div class="finish-grid">' +
      '<div><div class="stat-num fstat-num">' + fmtDuration(f.durationSec) + '</div><div class="fstat-label">Time</div></div>' +
      '<div><div class="stat-num fstat-num">' + f.sets + '</div><div class="fstat-label">Sets</div></div>' +
      '<div><div class="stat-num fstat-num">' + f.exercises + '</div><div class="fstat-label">Exercises</div></div>' +
      '</div>' +
      '<div class="stat-num finish-vol">' + Math.round(f.volume).toLocaleString() + ' kg</div>' +
      '<div class="finish-vol-lbl">Total Volume</div>' +
      (f.kcal !== null && f.kcal !== undefined ? '<div class="finish-kcal">~' + f.kcal + ' kcal burned <span>(estimate)</span></div>' : '') +
      (f.prCount > 0 ? '<div class="pr-line">\ud83c\udfc6 ' + f.prCount + ' new PR' + (f.prCount > 1 ? 's' : '') + '</div>' : '') +
      '<button class="big-cta" id="finishDoneBtn">Done</button>' +
